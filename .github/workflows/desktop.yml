name: Windows app
# Builds the Tauri installer on GitHub's Windows machines (nothing heavy runs on a laptop).
# Pull requests: build and attach the installer as an artifact for testing.
# Tags vX.Y.Z: build, sign the update, and publish a GitHub Release with latest.json for auto-update.
on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile

      - name: Build installer (test)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Keep the test installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: langplay-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

      - name: Build and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Langplay ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what's new. Download Langplay_*_x64-setup.exe and run it."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
