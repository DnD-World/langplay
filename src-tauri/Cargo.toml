[package]
name = "langplay"
version = "0.2.0"
description = "Learn LangChain and LangGraph without code"
authors = ["Lambros Stravelakis"]
license = "MIT"
repository = "https://github.com/DnD-World/langplay"
edition = "2021"
rust-version = "1.80"

[lib]
name = "langplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-http = "2.6.1"
tauri-plugin-opener = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12.0"
ureq = "3.4.2"
sha2 = "0.10.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
